name: Validate verifier

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Commit expected by the catalog refresh workflow'
        required: false
        type: string

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm the dispatched commit
        if: github.event_name == 'workflow_dispatch' && inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify every committed signed release manifest
        run: python tools/check_catalog.py
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check vendor/bitsaga/sha256.js
      - name: Check site assets and links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          html = (root / 'index.html').read_text(encoding='utf-8')
          german_html = (root / 'de' / 'index.html').read_text(encoding='utf-8')
          script = (root / 'app.js').read_text(encoding='utf-8')
          for name in re.findall(r"image: '([^']+)'", script):
              assert (root / 'assets' / name).is_file(), name
          for name in re.findall(r'href="(assets/[^"?]+)"', html):
              assert (root / name).is_file(), name
          assert '<html lang="en">' in html
          assert '<html lang="de">' in german_html
          assert 'https://verify.clavastack.com/de/' in html and german_html
          assert 'https://verify.clavastack.com/' in html and german_html
          for name in re.findall(r'(?:href|src)="\.\./([^"?]+)', german_html):
              assert (root / name).is_file(), name
          assert 'lang: languageFromUrl()' in script
          assert "fetch(sitePath('release.json')" in script
          assert 'https://github.com/Schnuartz/verify-clavastack' in script
          assert '\u2014' not in script and '\u2013' not in script
          print('OK: product images, favicon, repository link and dash style')
          PY
  deploy_catalog:
    if: github.event_name == 'workflow_dispatch' && inputs.expected_sha != ''
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Deploy the validated catalog update
        env:
          VALIDATED_SHA: ${{ inputs.expected_sha }}
          HOSTINGER_DEPLOY_WEBHOOK: ${{ secrets.HOSTINGER_DEPLOY_WEBHOOK }}
        run: bash tools/deploy_hostinger.sh
