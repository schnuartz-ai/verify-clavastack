name: Refresh signed Specter catalog

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      verify_pipeline:
        description: 'Run validation and deployment even when the catalog is unchanged (pipeline test)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-specter-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check upstream signatures and refresh catalog
        run: |
          python tools/update_releases.py
          python tools/check_catalog.py
      - name: Commit new verified releases
        id: catalog
        run: |
          git add release.json keys signatures
          if git diff --cached --quiet; then
            echo 'No catalog changes.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh verified Specter release catalog'
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate the committed catalog before deployment
        if: steps.catalog.outputs.changed == 'true' || inputs.verify_pipeline == true
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.catalog.outputs.sha }}
        run: gh workflow run validate.yml --ref main --field "expected_sha=$EXPECTED_SHA"
