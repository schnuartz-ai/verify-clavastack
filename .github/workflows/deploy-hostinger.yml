name: Deploy verified site to Hostinger

on:
  workflow_run:
    workflows: [Validate verifier]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Trigger Hostinger only for the validated current commit
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          HOSTINGER_DEPLOY_WEBHOOK: ${{ secrets.HOSTINGER_DEPLOY_WEBHOOK }}
        run: bash tools/deploy_hostinger.sh
